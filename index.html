<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131b"><title>Sadia AI — Live Call</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07131b}.app{max-width:500px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:linear-gradient(170deg,#0a2630,#061017 65%);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 8px}.brand{font-size:19px;font-weight:750;letter-spacing:-.4px}.brand span{color:#7fe8d2}.secure{font-size:11px;color:#a5d5cb;border:1px solid #ffffff22;padding:7px 10px;border-radius:99px}.stage{position:relative;flex:1;min-height:390px;margin:10px 12px 0;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#36525a,#162e38 48%,#0a1722 85%);display:flex;flex-direction:column;align-items:center;justify-content:center}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 70%,#07131b99);pointer-events:none}.portrait{width:min(74vw,315px);height:min(95vw,410px);max-height:55vh;border-radius:46% 46% 42% 42%;overflow:hidden;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#45636a,#162b3a);box-shadow:0 15px 85px #0009;transform-origin:50% 75%}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:none}.portrait.has-photo img{display:block}.placeholder{font-size:105px;color:#bce8dd}.portrait.has-photo .placeholder{display:none}.portrait.talking{animation:talk .45s ease-in-out infinite alternate}.portrait.listening{animation:breathe 3s ease-in-out infinite}.portrait.talking:after{content:"";position:absolute;bottom:13%;left:44%;width:12%;height:3%;border-radius:50%;background:#432e3c88;filter:blur(7px);animation:mouth .3s infinite alternate}@keyframes talk{from{transform:translateY(0) scale(1)}to{transform:translateY(-3px) scale(var(--talk-pulse,1.018))}}@keyframes breathe{50%{transform:scale(1.012)}}@keyframes mouth{to{height:5%}}.info{z-index:1;text-align:center;margin-top:15px}.name{font-size:28px;font-weight:700}.state{font-size:13px;color:#b4d3d3;margin-top:5px}.online{width:8px;height:8px;display:inline-block;background:#61e7b2;border-radius:50%;margin-right:6px}.photo-btn{z-index:2;margin-top:14px;background:#ffffff20;border:1px solid #ffffff33;color:white;border-radius:30px;padding:10px 15px;font-size:12px;cursor:pointer}.photo-btn input{display:none}.self{position:absolute;right:16px;top:18px;width:86px;height:118px;border-radius:17px;border:2px solid #ffffff55;background:#182b35;display:grid;place-items:center;color:#b9d6d6;font-size:11px;z-index:2;overflow:hidden}.self video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}.self.on video{display:block}.self.on span{display:none}.bottom{padding:14px 18px calc(22px + env(safe-area-inset-bottom))}.transcript{background:#ffffff0b;border:1px solid #ffffff15;border-radius:16px;padding:12px 14px;min-height:64px;max-height:110px;overflow:auto;font-size:13px;white-space:pre-line;line-height:1.5;color:#d3e6e7}.actions{display:flex;align-items:center;justify-content:center;gap:15px;margin:19px 0 9px}.action{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff22;background:#203943;color:#fff;font-size:23px;cursor:pointer}.action.primary{background:#24b78e}.action.danger{background:#ef5364}.action:disabled{opacity:.45}.caption{text-align:center;font-size:11px;color:#93aab1;line-height:1.5}.fallback{display:flex;gap:8px;margin-top:10px}.fallback input{min-width:0;flex:1;border:1px solid #ffffff33;background:#132934;color:white;padding:11px;border-radius:12px}.fallback button{border:0;background:#36b99a;color:#061c20;padding:0 16px;border-radius:12px;font-weight:700}
</style></head><body><main class="app"><header class="top"><div class="brand">Sadia <span>AI Live</span></div><div class="secure">● Private browser demo</div></header><section class="stage"><div class="self" id="self"><video id="camera" autoplay muted playsinline></video><span>Camera off</span></div><div class="portrait" id="portrait"><span class="placeholder">✦</span><img id="face" alt="Sadia portrait"></div><div class="info"><div class="name">Sadia</div><div class="state"><i class="online"></i><span id="status">Ready to call</span></div></div><label class="photo-btn">＋ Sadia-এর ছবি যোগ করো<input id="photo" type="file" accept="image/*"></label></section><section class="bottom"><div class="transcript" id="transcript" aria-live="polite">কল শুরু করতে সবুজ বাটন চাপো। বাংলায় কথা বলতে পারো।</div><div class="fallback"><input id="message" placeholder="অথবা বাংলায় লিখে পাঠাও"><button id="send">পাঠাও</button></div><div class="actions"><button class="action" id="mute" title="Mute microphone" aria-label="Mute microphone">🎙</button><button class="action" id="cameraToggle" title="Camera" aria-label="Camera">📷</button><button class="action primary" id="call" title="Start call" aria-label="Start call">☎</button><button class="action danger" id="end" title="End call" aria-label="End call">■</button></div><div class="caption">GPU-free animated demo · Browser speech support varies · No real video stream or cloned voice</div></section></main><script src="./app.js"></script></body></html>
